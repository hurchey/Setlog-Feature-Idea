# XcodeGen spec. Run `xcodegen generate` to (re)create SetlogConcept.xcodeproj.
name: SetlogConcept

options:
  bundleIdPrefix: com.erichurchey
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  SetlogConcept:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # Optional demo photos; the demo falls back to color washes without them.
      - path: DemoPhotos
        type: folder
        optional: true
    dependencies:
      - target: SetlogWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erichurchey.SetlogConcept
    info:
      path: Config/SetlogConcept-Info.plist
      properties:
        CFBundleDisplayName: Setlog Concept
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.erichurchey.SetlogConcept
            CFBundleURLSchemes:
              - setlogconcept
    # Must match Store.appGroupID in Shared/Store.swift.
    entitlements:
      path: Config/SetlogConcept.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.setlogconcept
    scheme: {}

  SetlogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - path: DemoPhotos
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erichurchey.SetlogConcept.SetlogWidgets
        SKIP_INSTALL: YES
    info:
      path: Config/SetlogWidgets-Info.plist
      properties:
        CFBundleDisplayName: Setlog Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/SetlogWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.setlogconcept
